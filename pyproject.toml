[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-media-downloader-bot"
version = "1.0.0"
description = "Simple Open-Source Telegram Media Downloader Bot by sourcio.ir"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.01.01",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
